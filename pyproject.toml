[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enfor"
version = "1.0.0"
description = "EnFoR: exact answerability for spatial reasoning with frames of reference"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "z3-solver>=4.12",
    "numpy>=1.26",
    "datasets>=3.0",
    "pandas>=2.0",
    "pyarrow>=14",
]

[project.optional-dependencies]
vllm = ["vllm>=0.19"]
claude = ["anthropic>=0.100"]

[tool.setuptools.packages.find]
include = ["enfor*"]

[tool.ruff]
line-length = 120
target-version = "py310"
